[project]
name = "aic-abr"
version = "0.1.0"
description = "Shot-aware keyframe selection and Qwen visual embeddings on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "modal>=1.6.3",
    "numpy>=2,<3",
    "omnishotcut",
    "pillow>=11",
    "pyarrow>=20,<24",
    "torch>=2.15.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
benchmark = [
    "av>=19.0.2",
    "decord==0.6.0",
]
pipeline = [
    "opencv-python>=5,<6",
    "nvidia-dali-cuda130==2.4.0",
    "sentence-transformers==5.4.0",
    "transformers>=5,<6",
]
retrieval = [
    "pymilvus>=3.0.2",
    "python-dotenv>=1.2.4",
]

[tool.uv.sources]
omnishotcut = { git = "https://github.com/UVA-Computer-Vision-Lab/OmniShotCut.git" }

[dependency-groups]
dev = [
    "av>=19.0.2",
    "httpx2>=2.16.0",
    "pytest>=8,<10",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
